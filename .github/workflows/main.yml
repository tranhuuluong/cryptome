name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon --parallel --build-cache --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: warn

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --parallel --build-cache --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, tests]
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, tests, build]
    permissions:
      contents: read

    steps:
      - name: Display CI Summary
        run: |
          LINT_STATUS=$([ "${{ needs.lint.result }}" = "success" ] && echo "✅" || echo "❌")
          TESTS_STATUS=$([ "${{ needs.tests.result }}" = "success" ] && echo "✅" || echo "❌")
          BUILD_STATUS=$([ "${{ needs.build.result }}" = "success" ] && echo "✅" || echo "❌")

          echo "## 📦 Android CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ------ |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | $LINT_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | $TESTS_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Build APK | $BUILD_STATUS |" >> $GITHUB_STEP_SUMMARY
